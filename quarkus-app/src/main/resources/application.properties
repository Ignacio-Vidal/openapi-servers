quarkus.index-dependency.contracts.group-id=com.example
quarkus.index-dependency.contracts.artifact-id=contracts

# Multipart uploads: every part must fit within max-form-attribute-size, which defaults to
# 2048 bytes. Anything larger is rejected with HTTP 413, so raise it for real file uploads.
quarkus.http.limits.max-form-attribute-size=10M

# The REST Client defaults to the RFC1738 multipart encoder, which cannot encode several parts
# that share one name (as an array of binary properties does). HTML5 mode encodes them correctly;
# without it the server rejects the body with MultipartParser$MalformedMessageException.
quarkus.rest-client.multipart-post-encoder-mode=HTML5

# Base URI for the generated FileSinkApi client, which the upload endpoints relay through to mimic
# a downstream service. `configKeyFromClassName=true` makes the generator emit
# @RegisterRestClient(configKey="filesink-api"), so it is registered by that key here rather than
# by fully-qualified class name. Here the "downstream" loops back to this same application, so the
# URL is built from the port this instance is actually listening on; `${quarkus.http.port}` is
# resolved at runtime, which matters under @QuarkusTest where the port is 8081, not 8080.
quarkus.rest-client.filesink-api.url=http://localhost:${quarkus.http.port}

# Logging
quarkus.log.level=INFO
quarkus.package.jar.type=uber-jar

# Console logging. NOTE: the property is `enabled`, not `enable` -- Quarkus warns
# "The quarkus.log.console.enable config property is deprecated" and ignores the misspelt form.
quarkus.log.console.enabled=true
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Application logging: the upload/sink adapters log at INFO what they received and forwarded.
quarkus.log.category."com.example".level=INFO

# HTTP access log: one line per request, which is what shows the /uploads/* -> /api/v1/files/sink
# hop actually happening over the wire. Left on the default "common" pattern -- in the access-log
# pattern `%t` already emits its own brackets and `%D` is not supported, so a hand-rolled
# `[%t] ... %D ms` renders as `[[...]]` and a literal `- ms`.
quarkus.http.access-log.enabled=true
quarkus.otel.enabled=false
quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true

# OIDC
quarkus.oidc.application-type=service
quarkus.oidc.client-id=backend-service

# Dev Services: Keycloak (alice/alice→admin,user  bob/bob→user)
%dev.quarkus.keycloak.devservices.port=9090
%dev.quarkus.keycloak.devservices.realm-name=quarkus
%dev.quarkus.keycloak.devservices.java-opts=-XX:UseSVE=0
# Required, and load-bearing in two ways. Docker Desktop on macOS forwards through a VM, so
# Keycloak sees requests as non-local and enforces sslRequired. This runs
# `kcadm.sh update realms/master -s sslRequired=NONE` in the container, which is what lets Dev
# Services acquire its admin token from master -- without it the admin token request itself fails
# with 403 "HTTPS required", no realm can be created at all, and OIDC discovery 404s with
# "Realm does not exist".
%dev.quarkus.keycloak.devservices.disable-https=true
# The realm is imported from a file rather than generated from devservices.roles.* because
# disable-https only ever patches master: the Dev Services processor hardcodes `realms/master` and
# ignores realm-name, so a generated 'quarkus' realm keeps Keycloak's default sslRequired=external
# and every OIDC call against it is rejected with 403 "HTTPS required". Pointing realm-name at
# master instead is not a fix -- Dev Services skips creation when the realm already exists, so
# there would be no backend-service client and no alice/bob at all. This file sets
# sslRequired=none up front. The test profile points at this same file (src/main/resources is on
# the test classpath), so users and roles only need changing in one place.
%dev.quarkus.keycloak.devservices.realm-path=quarkus-realm.json

# Dev UI: password grant so you can enter alice/alice or bob/bob to get a JWT
%dev.quarkus.oidc.devui.grant.type=password

quarkus.dev-mcp.enabled=true

# ── OIDC client: background token refresh ────────────────────────────────────
# Models a service that takes unauthenticated traffic and makes authenticated downstream calls.
# The goal is that no incoming request ever pays for a token round trip.
#
# The client-credentials grant is what a service uses to authenticate as itself (no end user).
# backend-service has serviceAccountsEnabled=true in quarkus-realm.json, which is what permits it.
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.client-id=backend-service
quarkus.oidc-client.credentials.secret=secret
quarkus.oidc-client.grant.type=client

# The two properties that move token acquisition off the request path.
#
# refresh-interval schedules a Vert.x periodic timer that refreshes the token in the background.
# refresh-token-time-skew makes that timer refresh a token that is merely NEAR expiry instead of
# waiting until it is already dead — without it the timer only acts after expiry, which leaves
# precisely the latency window this setup exists to close. The skew must therefore be comfortably
# LARGER than the interval.
#
# These are tuned for the deliberately hostile 5-second token lifespan set in quarkus-realm.json:
# refreshed every second, and treated as stale with 3 of its 5 seconds remaining. For a realistic
# 300s token, something like refresh-interval=60s with refresh-token-time-skew=90s is the
# equivalent shape.
# The interval must be comfortably SHORTER than the window the skew opens, or the timer will not
# reliably be the one that notices the token is stale. The timer and incoming requests share a
# single token cache, so whichever looks first performs the refresh; if the timer fires only once
# inside the stale window, a request can beat it and pay for the acquisition itself. Here the skew
# marks a 5s token stale with 4s left and the timer checks 5x/second, so it always wins the race.
quarkus.oidc-client.refresh-interval=200ms
quarkus.oidc-client.refresh-token-time-skew=4s

# Keycloak does not return a refresh token for client_credentials, so each background refresh
# re-acquires with the grant instead. That is handled automatically and is not an error.
quarkus.log.category."io.quarkus.oidc.client".level=DEBUG
quarkus.log.category."com.example.OidcClientTokenFilter".level=DEBUG
