quarkus.http.test-port=0

# Keycloak Dev Services for @QuarkusTest. The realm/roles are configured under %dev. in the main
# application.properties, which does not apply to the test profile, so they are repeated here.
# The port is deliberately left unset: Dev Services picks a free one and SecurityApiTest reads
# the resulting URL from quarkus.oidc.auth-server-url.
quarkus.keycloak.devservices.realm-name=quarkus
quarkus.keycloak.devservices.roles.alice=admin,user
quarkus.keycloak.devservices.roles.bob=user
quarkus.keycloak.devservices.java-opts=-XX:UseSVE=0

