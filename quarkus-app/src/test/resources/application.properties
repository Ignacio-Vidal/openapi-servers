# @QuarkusTest starts its own server on a free port, which keeps the default `test` run isolated
# and collision-free. To instead drive an already-running app (e.g. one started under a debugger),
# see the `testAgainstRunningServer` task in build.gradle.kts, which sets -Dtest.base-uri.
quarkus.http.test-port=0

# Keycloak Dev Services for @QuarkusTest. The realm is configured under %dev. in the main
# application.properties, which does not apply to the test profile, so it is repeated here.
# The port is deliberately left unset: Dev Services picks a free one and SecurityApiTest reads
# the resulting URL from quarkus.oidc.auth-server-url.
quarkus.keycloak.devservices.realm-name=quarkus
quarkus.keycloak.devservices.java-opts=-XX:UseSVE=0
# On macOS the container ports do not bind to localhost, so Keycloak enforces sslRequired and
# rejects Dev Services' admin calls with "HTTPS required". This runs
# `kcadm.sh update realms/master -s sslRequired=NONE` in the container, which is what lets Dev
# Services acquire its admin token from master at all -- without it no realm can be created.
quarkus.keycloak.devservices.disable-https=true
# The realm comes from the same import file dev mode uses (src/main/resources is on the test
# classpath). A realm generated from devservices.roles.* would keep Keycloak's default
# sslRequired=external -- disable-https above only ever patches master, because the Dev Services
# processor hardcodes `realms/master` and ignores realm-name -- so every OIDC call against the
# quarkus realm would fail with 403 "HTTPS required" regardless of which port Dev Services picks.
quarkus.keycloak.devservices.realm-path=quarkus-realm.json


# OIDC client: BackgroundTokenRefreshTest asserts that tokens are refreshed off the request path.
# DEBUG on this category is what makes the refresh observable -- the log line reports the thread,
# which is the real tell: refreshes on a "vert.x-eventloop-*" thread are the background timer,
# while refreshes on the caller's thread mean the timer was never scheduled and the request path
# is paying for token acquisition. quarkus.log.min-level must be lowered too, otherwise the
# category level cannot take effect (min-level defaults to INFO and filters DEBUG out first).
quarkus.log.category."io.quarkus.oidc.client".level=DEBUG
quarkus.log.min-level=DEBUG
quarkus.log.console.level=DEBUG
