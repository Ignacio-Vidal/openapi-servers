openapi: "3.1.1"
info:
  title: Pet API
  version: "1.0.0"
  description: API for creating pets supporting cats and dogs

tags:
  - name: Pet
    description: Operations related to pets
  - name: SecurityTest
    description: One endpoint per @RolesAllowed edge case from PR 23680
  - name: PermitAllTest
    description: One endpoint per @PermitAll edge case from PR 23782
  - name: FileUpload
    description: Single and multiple multipart/form-data file uploads
  - name: FileSink
    description: Downstream receiver that forwarded uploads are relayed to

# Global security: enables Rules B, C, E from PR 23782 to be exercised by
# endpoints below. Pre-existing endpoints opt out explicitly with security: [].
security:
  - httpBearer: []

paths:
  /pets:
    post:
      summary: Create a pet
      operationId: createPet
      tags:
        - Pet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: PetRequest
              $ref: "#/components/schemas/PetRequest"
            examples:
              cat:
                summary: Cat request
                value:
                  petType: CAT
                  name: "Whiskers"
                  indoor: true
                  breedType: DOMESTIC_SHORTHAIR
                  ownerEmail: owner@example.com
              dog:
                summary: Dog request
                value:
                  petType: DOG
                  name: "Buddy"
                  breedType: LABRADOR
                  trained: true
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
              examples:
                cat:
                  summary: Cat response
                  value:
                    id: "pet_01HQ7CAT123456789"
                    petType: CAT
                    name: "Whiskers"
                    indoor: true
                    breedType: DOMESTIC_SHORTHAIR
                    age: 3.5
                    createdAt: "2024-02-01T10:30:00Z"
                dog:
                  summary: Dog response
                  value:
                    id: "pet_01HQ7DOG987654321"
                    petType: DOG
                    name: "Buddy"
                    breedType: LABRADOR
                    trained: true
                    createdAt: "2024-02-01T10:30:00Z"
  /v2/pets:
    post:
      summary: Create a pet
      operationId: createPetV2
      tags:
        - Pet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: PetRequest
              $ref: "#/components/schemas/PetRequestV2"
            examples:
              cat:
                summary: Cat request
                value:
                  petType: CAT
                  name: "Whiskers"
                  indoor: true
                  breedType: DOMESTIC_SHORTHAIR
              dog:
                summary: Dog request
                value:
                  petType: DOG
                  name: "Buddy"
                  breedType: LABRADOR
                  trained: true
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponseV2'
              examples:
                cat:
                  summary: Cat response
                  value:
                    id: "pet_01HQ7CAT123456789"
                    petType: CAT
                    name: "Whiskers"
                    indoor: true
                    breedType: DOMESTIC_SHORTHAIR
                    age: 3.5
                    createdAt: "2024-02-01T10:30:00Z"
                dog:
                  summary: Dog response
                  value:
                    id: "pet_01HQ7DOG987654321"
                    petType: DOG
                    name: "Buddy"
                    breedType: LABRADOR
                    trained: true
                    createdAt: "2024-02-01T10:30:00Z"
