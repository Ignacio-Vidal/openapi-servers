  /pets/{petId}:
    put:
      operationId: updatePet
      tags: [Pet]
      description: Update an existing pet
      summary: Update a pet
      security: []
      parameters:
        - name: petId
          in: path
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
            examples:
              cat:
                summary: Cat update
                value:
                  petType: CAT
                  name: "Whiskers"
                  indoor: false
                  breedType: MAINE_COON
                  declawed: false
                  ownerEmail: owner@example.com
              dog:
                summary: Dog update
                value:
                  petType: DOG
                  name: "Buddy"
                  breedType: GOLDEN_RETRIEVER
                  trained: true
                  weightKg: 30.5
      responses:
        '204':
          description: Pet updated successfully

  # -----------------------------------------------
  # Security annotation edge-case endpoints
  # Each path exercises exactly one case from PR 23680.
  # Annotation emitted = @RolesAllowed({"**"}) expected.
  # -----------------------------------------------

  /security-tests/http-basic:
    get:
      operationId: testHttpBasic
      tags: [SecurityTest]
      summary: "HTTP Basic — no scope concept, annotation emitted"
      security:
        - httpBasic: []
      responses:
        '204':
          description: OK

  /security-tests/http-bearer:
    get:
      operationId: testHttpBearer
      tags: [SecurityTest]
      summary: "HTTP Bearer — no scope concept, annotation emitted"
      security:
        - httpBearer: []
      responses:
        '204':
          description: OK

  /security-tests/api-key:
    get:
      operationId: testApiKey
      tags: [SecurityTest]
      summary: "API Key — no scope concept, annotation emitted"
      security:
        - apiKeyAuth: []
      responses:
        '204':
          description: OK

  /security-tests/mtls:
    get:
      operationId: testMtls
      tags: [SecurityTest]
      summary: "MutualTLS — no scope concept, annotation emitted"
      security:
        - mtls: []
      responses:
        '204':
          description: OK

  /security-tests/oauth2-empty-scopes:
    get:
      operationId: testOauth2EmptyScopes
      tags: [SecurityTest]
      summary: "OAuth2 empty scopes — qualifies, annotation emitted"
      security:
        - oauth2: []
      responses:
        '204':
          description: OK

  /security-tests/openid-empty-scopes:
    get:
      operationId: testOpenIdEmptyScopes
      tags: [SecurityTest]
      summary: "OpenID Connect empty scopes — qualifies, annotation emitted"
      security:
        - openID: []
      responses:
        '204':
          description: OK

  /security-tests/oauth2-with-scopes:
    get:
      operationId: testOauth2WithScopes
      tags: [SecurityTest]
      summary: "OAuth2 with explicit scopes — scoped, annotation NOT emitted"
      security:
        - oauth2: [read:pets]
      responses:
        '204':
          description: OK

  /security-tests/or-one-qualifies:
    get:
      operationId: testOrOneQualifies
      tags: [SecurityTest]
      summary: "OR: scoped OAuth2 OR empty API key — one alternative qualifies, annotation emitted"
      security:
        - oauth2: [read:pets]
        - apiKeyAuth: []
      responses:
        '204':
          description: OK

  /security-tests/and-all-qualify:
    get:
      operationId: testAndAllQualify
      tags: [SecurityTest]
      summary: "AND: API key AND HTTP Basic — all co-required schemes qualify, annotation emitted"
      security:
        - apiKeyAuth: []
          httpBasic: []
      responses:
        '204':
          description: OK

  /security-tests/and-not-all-qualify:
    get:
      operationId: testAndNotAllQualify
      tags: [SecurityTest]
      summary: "AND: empty OAuth2 AND scoped OpenID — scoped member blocks annotation, NOT emitted"
      security:
        - oauth2: []
          openID: [read:pets]
      responses:
        '204':
          description: OK

  /security-tests/no-security:
    get:
      operationId: testNoSecurity
      tags: [SecurityTest]
      summary: "Explicit empty security array — no auth required, @PermitAll emitted (Rule A)"
      security: []
      responses:
        '204':
          description: OK

  # -----------------------------------------------
  # @PermitAll edge-case endpoints (PR 23782)
  # The global `security: [httpBearer: []]` defined at the top of this spec
  # enables Rules B, C, E to be exercised without changing pre-existing
  # endpoints (which explicitly opt out with `security: []`).
  # -----------------------------------------------

  /permit-all-tests/op-empty-overrides-global:
    get:
      operationId: testPermitAllOpEmptyOverridesGlobal
      tags: [PermitAllTest]
      summary: "Rule C: op-level security:[] overrides non-empty global httpBearer — @PermitAll emitted"
      security: []
      responses:
        '204':
          description: OK

  /permit-all-tests/inherits-non-empty-global:
    get:
      operationId: testPermitAllInheritsNonEmptyGlobal
      tags: [PermitAllTest]
      summary: "Sanity check: no op-level security inherits global httpBearer — @RolesAllowed({\"**\"}) emitted (NOT @PermitAll)"
      responses:
        '204':
          description: OK

  /permit-all-tests/or-with-anonymous:
    get:
      operationId: testPermitAllOrWithAnonymous
      tags: [PermitAllTest]
      summary: "Rule F: OR list with anonymous alternative ({}) — least-restrictive wins, @PermitAll emitted"
      security:
        - oauth2: [read:pets]
        - {}
      responses:
        '204':
          description: OK

  # -----------------------------------------------
  # multipart/form-data file upload endpoints.
  # A `type: array` of `format: binary` items used to be collapsed onto the
  # scalar file type, generating the same signature as a single-file upload.
  # These endpoints pin both shapes so the generated parameters stay distinct.
  # -----------------------------------------------

  /uploads/single:
    post:
      operationId: uploadSingleFile
      tags: [FileUpload]
      summary: "One binary property is bound to a scalar FileUpload"
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - fileUpload
              properties:
                # Named `fileUpload` rather than `file`: `file` is a reserved word in the Java
                # generator (it maps to the File type), so it would be escaped to `_file`.
                fileUpload:
                  type: string
                  format: binary
                  description: The file to upload
                description:
                  type: string
                  description: Free-text description of the upload
            examples:
              withDescription:
                summary: A file sent with a description
                value:
                  fileUpload: "hello from a single upload"
                  description: "A short text file"
              fileOnly:
                summary: Only the required file part
                value:
                  fileUpload: "hello from a single upload"
      responses:
        '202':
          description: Upload accepted

  /uploads/multiple:
    post:
      operationId: uploadMultipleFiles
      tags: [FileUpload]
      summary: "An array of binary items is bound to List<FileUpload> under one part name"
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  description: The files to upload, all sharing the `files` part name
                  items:
                    type: string
                    format: binary
                description:
                  type: string
                  description: Free-text description of the upload
            examples:
              twoFiles:
                summary: Two files sharing the `files` part name
                value:
                  files:
                    - "contents of the first file"
                    - "contents of the second file"
                  description: "A batch of two text files"
              singleFile:
                summary: A one-element array, which still binds to the list
                value:
                  files:
                    - "contents of the only file"
      responses:
        '202':
          description: Uploads accepted

  /uploads/mixed:
    post:
      operationId: uploadMixed
      tags: [FileUpload]
      summary: "A file next to a non-file array — only the file type is affected by the binary binding"
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - fileUpload
              properties:
                fileUpload:
                  type: string
                  format: binary
                  description: A single file, bound to a scalar
                tags:
                  type: array
                  description: A non-file array, which must stay a plain List
                  items:
                    type: string
                description:
                  type: string
                  description: Free-text description of the upload
            examples:
              fileWithTags:
                summary: A single file alongside a plain string array
                value:
                  fileUpload: "contents of the uploaded file"
                  tags:
                    - "holiday"
                    - "2024"
                  description: "A file with two tags"
              fileWithoutTags:
                summary: The non-file array omitted entirely
                value:
                  fileUpload: "contents of the uploaded file"
      responses:
        '202':
          description: Upload accepted

  # -----------------------------------------------
  # Downstream sink. Stands in for a separate service: the /uploads/* endpoints
  # forward to this path through the GENERATED CLIENT, so a request exercises
  # server-side binding and client-side multipart encoding in one hop.
  #
  # It returns a receipt rather than a bare 202 so tests can assert the bytes
  # survived the hop, instead of only that a status code came back.
  # -----------------------------------------------
  /api/v1/files/sink:
    post:
      operationId: sinkFiles
      tags: [FileSink]
      summary: "Terminal receiver for forwarded uploads; echoes back what it received"
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  description: The forwarded files, all sharing the `files` part name
                  items:
                    type: string
                    format: binary
                description:
                  type: string
                  description: Free-text description carried over from the original upload
            examples:
              forwardedBatch:
                summary: Two forwarded files with the description carried over
                value:
                  files:
                    - "contents of the first file"
                    - "contents of the second file"
                  description: "A batch of two text files"
      responses:
        '200':
          description: Files received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkReceipt'
              examples:
                forwardedBatch:
                  summary: Receipt for the two forwarded files above
                  value:
                    fileNames:
                      - "first.txt"
                      - "second.txt"
                    contents:
                      - "contents of the first file"
                      - "contents of the second file"
                    totalBytes: 53
                    description: "A batch of two text files"

components:
  schemas:
    SinkReceipt:
      type: object
      description: What the downstream sink actually received, echoed back for assertions
      required:
        - fileNames
        - contents
        - totalBytes
      properties:
        fileNames:
          type: array
          description: Submitted file name of each part, in the order received
          items:
            type: string
        contents:
          type: array
          description: Body of each received file, so a test can prove the bytes survived the hop
          items:
            type: string
        totalBytes:
          type: integer
          format: int64
          description: Sum of the received file sizes
        description:
          type: string
          description: The description carried over from the original upload

    PetType:
      type: string
      enum:
        - CAT
        - DOG
      description: Discriminator value identifying the type of pet

    CatBreedType:
      type: string
      enum:
        - DOMESTIC_SHORTHAIR
        - PERSIAN
        - MAINE_COON
        - SIAMESE
        - BENGAL
      description: Breed of the cat

    DogBreedType:
      type: string
      enum:
        - LABRADOR
        - GOLDEN_RETRIEVER
        - BULLDOG
        - POODLE
        - GERMAN_SHEPHERD
      description: Breed of the dog

    # -----------------------------------------------
    # Request base schema
    # Discriminator lives here on the parent so the
    # openapi generator produces correct Java
    # inheritance with extends rather than flattening
    # -----------------------------------------------

    PetRequest:
      type: object
      required:
        - petType
        - name
      properties:
        petType:
          type: string
          enum:
            - CAT
            - DOG
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the pet
          examples:
            - "Whiskers"
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatRequest'
          DOG: '#/components/schemas/DogRequest'

    # -----------------------------------------------
    # Response base schema
    # Discriminator also lives here on the parent
    # -----------------------------------------------

    PetResponse:
      type: object
      required:
        - petType
      properties:
        petType:
          type: string
          enum:
            - CAT
            - DOG
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the pet
          examples:
            - "Whiskers"
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatResponse'
          DOG: '#/components/schemas/DogResponse'

    # -----------------------------------------------
    # Cat request - child references parent via allOf
    # -----------------------------------------------

    CatRequest:
      type: object
      description: Request payload for creating a cat
      required:
        - petType
        - name
        - breedType
        - indoor
        - ownerEmail
      allOf:
        - $ref: '#/components/schemas/PetRequest'
        - type: object
          required:
            - breedType
            - indoor
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false
            ownerEmail:
              type: string
              format: email
              description: Contact email address for the cat's owner
              examples:
                - owner@example.com

    # -----------------------------------------------
    # Dog request - child references parent via allOf
    # -----------------------------------------------

    DogRequest:
      type: object
      description: Request payload for creating a dog
      required:
        - petType
        - name
        - breedType
        - trained
      allOf:
        - $ref: '#/components/schemas/PetRequest'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

    # -----------------------------------------------
    # Cat response - child references parent via allOf
    # -----------------------------------------------

    CatResponse:
      type: object
      description: Response payload for a cat resource
      allOf:
        - $ref: '#/components/schemas/PetResponse'
        - type: object
          required:
            - breedType
            - indoor
            - age
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false
            age:
              type: number
              minimum: 0
              maximum: 30
              description: Age of the cat in years
              examples:
                - 3.5

    # -----------------------------------------------
    # Dog response - child references parent via allOf
    # -----------------------------------------------

    DogResponse:
      type: object
      description: Response payload for a dog resource
      allOf:
        - $ref: '#/components/schemas/PetResponse'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

    PetRequestV2:
      type: object
      properties:
        petType:
          $ref: '#/components/schemas/PetType'
      oneOf:
        - $ref: '#/components/schemas/CatRequestV2'
        - $ref: '#/components/schemas/DogRequestV2'
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatRequestV2'
          DOG: '#/components/schemas/DogRequestV2'

    PetRequestV2Base:
        type: object
        required:
          - petType
          - name
        properties:
          petType:
            $ref: '#/components/schemas/PetType'
          name:
            type: string
            minLength: 1
            maxLength: 50
            description: Name of the pet
            examples:
                - "Whiskers"

    # -----------------------------------------------

    # Cat request - child references parent via allOf
    # -----------------------------------------------
    CatRequestV2:
      type: object
      description: Request payload for creating a cat
      required:
        - petType
        - name
        - breedType
        - indoor
      allOf:
        - $ref: '#/components/schemas/PetRequestV2Base'
        - type: object
          required:
            - breedType
            - indoor
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false

    # -----------------------------------------------

    # Dog request - child references parent via allOf
    # -----------------------------------------------
    DogRequestV2:
      type: object
      description: Request payload for creating a dog
      required:
        - petType
        - name
        - breedType
        - trained
      allOf:
        - $ref: '#/components/schemas/PetRequestV2Base'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

