openapi: "3.1.1"
info:
  title: Pet API
  version: "1.0.0"
  description: API for creating pets supporting cats and dogs

tags:
  - name: Pet
    description: Operations related to pets
  - name: SecurityTest
    description: One endpoint per @RolesAllowed edge case from PR 23680
  - name: PermitAllTest
    description: One endpoint per @PermitAll edge case from PR 23782

# Global security: enables Rules B, C, E from PR 23782 to be exercised by
# endpoints below. Pre-existing endpoints opt out explicitly with security: [].
security:
  - httpBearer: []

paths:
  /pets:
    post:
      summary: Create a pet
      operationId: createPet
      tags:
        - Pet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: PetRequest
              $ref: "#/components/schemas/PetRequest"
            examples:
              cat:
                summary: Cat request
                value:
                  petType: CAT
                  name: "Whiskers"
                  indoor: true
                  breedType: DOMESTIC_SHORTHAIR
              dog:
                summary: Dog request
                value:
                  petType: DOG
                  name: "Buddy"
                  breedType: LABRADOR
                  trained: true
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
              examples:
                cat:
                  summary: Cat response
                  value:
                    id: "pet_01HQ7CAT123456789"
                    petType: CAT
                    name: "Whiskers"
                    indoor: true
                    breedType: DOMESTIC_SHORTHAIR
                    createdAt: "2024-02-01T10:30:00Z"
                dog:
                  summary: Dog response
                  value:
                    id: "pet_01HQ7DOG987654321"
                    petType: DOG
                    name: "Buddy"
                    breedType: LABRADOR
                    trained: true
                    createdAt: "2024-02-01T10:30:00Z"
  /v2/pets:
    post:
      summary: Create a pet
      operationId: createPetV2
      tags:
        - Pet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: PetRequest
              $ref: "#/components/schemas/PetRequestV2"
            examples:
              cat:
                summary: Cat request
                value:
                  petType: CAT
                  name: "Whiskers"
                  indoor: true
                  breedType: DOMESTIC_SHORTHAIR
              dog:
                summary: Dog request
                value:
                  petType: DOG
                  name: "Buddy"
                  breedType: LABRADOR
                  trained: true
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponseV2'
              examples:
                cat:
                  summary: Cat response
                  value:
                    id: "pet_01HQ7CAT123456789"
                    petType: CAT
                    name: "Whiskers"
                    indoor: true
                    breedType: DOMESTIC_SHORTHAIR
                    createdAt: "2024-02-01T10:30:00Z"
                dog:
                  summary: Dog response
                  value:
                    id: "pet_01HQ7DOG987654321"
                    petType: DOG
                    name: "Buddy"
                    breedType: LABRADOR
                    trained: true
                    createdAt: "2024-02-01T10:30:00Z"
  /pets/{petId}:
    put:
      operationId: updatePet
      tags: [Pet]
      description: Update an existing pet
      summary: Update a pet
      security: []
      parameters:
        - name: petId
          in: path
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
      responses:
        '204':
          description: Pet updated successfully

  # -----------------------------------------------
  # Security annotation edge-case endpoints
  # Each path exercises exactly one case from PR 23680.
  # Annotation emitted = @RolesAllowed({"**"}) expected.
  # -----------------------------------------------

  /security-tests/http-basic:
    get:
      operationId: testHttpBasic
      tags: [SecurityTest]
      summary: "HTTP Basic — no scope concept, annotation emitted"
      security:
        - httpBasic: []
      responses:
        '204':
          description: OK

  /security-tests/http-bearer:
    get:
      operationId: testHttpBearer
      tags: [SecurityTest]
      summary: "HTTP Bearer — no scope concept, annotation emitted"
      security:
        - httpBearer: []
      responses:
        '204':
          description: OK

  /security-tests/api-key:
    get:
      operationId: testApiKey
      tags: [SecurityTest]
      summary: "API Key — no scope concept, annotation emitted"
      security:
        - apiKeyAuth: []
      responses:
        '204':
          description: OK

  /security-tests/mtls:
    get:
      operationId: testMtls
      tags: [SecurityTest]
      summary: "MutualTLS — no scope concept, annotation emitted"
      security:
        - mtls: []
      responses:
        '204':
          description: OK

  /security-tests/oauth2-empty-scopes:
    get:
      operationId: testOauth2EmptyScopes
      tags: [SecurityTest]
      summary: "OAuth2 empty scopes — qualifies, annotation emitted"
      security:
        - oauth2: []
      responses:
        '204':
          description: OK

  /security-tests/openid-empty-scopes:
    get:
      operationId: testOpenIdEmptyScopes
      tags: [SecurityTest]
      summary: "OpenID Connect empty scopes — qualifies, annotation emitted"
      security:
        - openID: []
      responses:
        '204':
          description: OK

  /security-tests/oauth2-with-scopes:
    get:
      operationId: testOauth2WithScopes
      tags: [SecurityTest]
      summary: "OAuth2 with explicit scopes — scoped, annotation NOT emitted"
      security:
        - oauth2: [read:pets]
      responses:
        '204':
          description: OK

  /security-tests/or-one-qualifies:
    get:
      operationId: testOrOneQualifies
      tags: [SecurityTest]
      summary: "OR: scoped OAuth2 OR empty API key — one alternative qualifies, annotation emitted"
      security:
        - oauth2: [read:pets]
        - apiKeyAuth: []
      responses:
        '204':
          description: OK

  /security-tests/and-all-qualify:
    get:
      operationId: testAndAllQualify
      tags: [SecurityTest]
      summary: "AND: API key AND HTTP Basic — all co-required schemes qualify, annotation emitted"
      security:
        - apiKeyAuth: []
          httpBasic: []
      responses:
        '204':
          description: OK

  /security-tests/and-not-all-qualify:
    get:
      operationId: testAndNotAllQualify
      tags: [SecurityTest]
      summary: "AND: empty OAuth2 AND scoped OpenID — scoped member blocks annotation, NOT emitted"
      security:
        - oauth2: []
          openID: [read:pets]
      responses:
        '204':
          description: OK

  /security-tests/no-security:
    get:
      operationId: testNoSecurity
      tags: [SecurityTest]
      summary: "Explicit empty security array — no auth required, @PermitAll emitted (Rule A)"
      security: []
      responses:
        '204':
          description: OK

  # -----------------------------------------------
  # @PermitAll edge-case endpoints (PR 23782)
  # The global `security: [httpBearer: []]` defined at the top of this spec
  # enables Rules B, C, E to be exercised without changing pre-existing
  # endpoints (which explicitly opt out with `security: []`).
  # -----------------------------------------------

  /permit-all-tests/op-empty-overrides-global:
    get:
      operationId: testPermitAllOpEmptyOverridesGlobal
      tags: [PermitAllTest]
      summary: "Rule C: op-level security:[] overrides non-empty global httpBearer — @PermitAll emitted"
      security: []
      responses:
        '204':
          description: OK

  /permit-all-tests/inherits-non-empty-global:
    get:
      operationId: testPermitAllInheritsNonEmptyGlobal
      tags: [PermitAllTest]
      summary: "Sanity check: no op-level security inherits global httpBearer — @RolesAllowed({\"**\"}) emitted (NOT @PermitAll)"
      responses:
        '204':
          description: OK

  /permit-all-tests/or-with-anonymous:
    get:
      operationId: testPermitAllOrWithAnonymous
      tags: [PermitAllTest]
      summary: "Rule F: OR list with anonymous alternative ({}) — least-restrictive wins, @PermitAll emitted"
      security:
        - oauth2: [read:pets]
        - {}
      responses:
        '204':
          description: OK

components:
  schemas:
    PetType:
      type: string
      enum:
        - CAT
        - DOG
      description: Discriminator value identifying the type of pet

    CatBreedType:
      type: string
      enum:
        - DOMESTIC_SHORTHAIR
        - PERSIAN
        - MAINE_COON
        - SIAMESE
        - BENGAL
      description: Breed of the cat

    DogBreedType:
      type: string
      enum:
        - LABRADOR
        - GOLDEN_RETRIEVER
        - BULLDOG
        - POODLE
        - GERMAN_SHEPHERD
      description: Breed of the dog

    # -----------------------------------------------
    # Request base schema
    # Discriminator lives here on the parent so the
    # openapi generator produces correct Java
    # inheritance with extends rather than flattening
    # -----------------------------------------------

    PetRequest:
      type: object
      required:
        - petType
        - name
      properties:
        petType:
          type: string
          enum:
            - CAT
            - DOG
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the pet
          examples:
            - "Whiskers"
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatRequest'
          DOG: '#/components/schemas/DogRequest'

    # -----------------------------------------------
    # Response base schema
    # Discriminator also lives here on the parent
    # -----------------------------------------------

    PetResponse:
      type: object
      required:
        - petType
      properties:
        petType:
          type: string
          enum:
            - CAT
            - DOG
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the pet
          examples:
            - "Whiskers"
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatResponse'
          DOG: '#/components/schemas/DogResponse'

    # -----------------------------------------------
    # Cat request - child references parent via allOf
    # -----------------------------------------------

    CatRequest:
      type: object
      description: Request payload for creating a cat
      required:
        - petType
        - name
        - breedType
        - indoor
        - ownerEmail
      allOf:
        - $ref: '#/components/schemas/PetRequest'
        - type: object
          required:
            - breedType
            - indoor
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false
            ownerEmail:
              type: string
              format: email
              description: Contact email address for the cat's owner
              examples:
                - owner@example.com

    # -----------------------------------------------
    # Dog request - child references parent via allOf
    # -----------------------------------------------

    DogRequest:
      type: object
      description: Request payload for creating a dog
      required:
        - petType
        - name
        - breedType
        - trained
      allOf:
        - $ref: '#/components/schemas/PetRequest'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

    # -----------------------------------------------
    # Cat response - child references parent via allOf
    # -----------------------------------------------

    CatResponse:
      type: object
      description: Response payload for a cat resource
      allOf:
        - $ref: '#/components/schemas/PetResponse'
        - type: object
          required:
            - breedType
            - indoor
            - age
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false
            age:
              type: number
              minimum: 0
              maximum: 30
              description: Age of the cat in years
              examples:
                - 3.5

    # -----------------------------------------------
    # Dog response - child references parent via allOf
    # -----------------------------------------------

    DogResponse:
      type: object
      description: Response payload for a dog resource
      allOf:
        - $ref: '#/components/schemas/PetResponse'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

    PetRequestV2:
      type: object
      properties:
        petType:
          $ref: '#/components/schemas/PetType'
      oneOf:
        - $ref: '#/components/schemas/CatRequestV2'
        - $ref: '#/components/schemas/DogRequestV2'
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatRequestV2'
          DOG: '#/components/schemas/DogRequestV2'

    PetRequestV2Base:
        type: object
        required:
          - petType
          - name
        properties:
          petType:
            $ref: '#/components/schemas/PetType'
          name:
            type: string
            minLength: 1
            maxLength: 50
            description: Name of the pet
            examples:
                - "Whiskers"
    # -----------------------------------------------
    # Response base schema
    # Discriminator also lives here on the parent
    # -----------------------------------------------

    # -----------------------------------------------

    # Cat request - child references parent via allOf
    # -----------------------------------------------
    CatRequestV2:
      type: object
      description: Request payload for creating a cat
      required:
        - petType
        - name
        - breedType
        - indoor
      allOf:
        - $ref: '#/components/schemas/PetRequestV2Base'
        - type: object
          required:
            - breedType
            - indoor
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false

    # -----------------------------------------------

    # Dog request - child references parent via allOf
    # -----------------------------------------------
    DogRequestV2:
      type: object
      description: Request payload for creating a dog
      required:
        - petType
        - name
        - breedType
        - trained
      allOf:
        - $ref: '#/components/schemas/PetRequestV2Base'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

    PetResponseV2:
      type: object
      properties:
        petType:
          $ref: '#/components/schemas/PetType'
      oneOf:
        - $ref: '#/components/schemas/CatResponseV2'
        - $ref: '#/components/schemas/DogResponseV2'
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatResponseV2'
          DOG: '#/components/schemas/DogResponseV2'

    # -----------------------------------------------
    # Cat response - child references parent via allOf
    # -----------------------------------------------

    PetResponseV2Base:
      type: object
      required:
        - petType
        - name
      properties:
        petType:
          $ref: '#/components/schemas/PetType'
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the pet
          examples:
            - "Whiskers"

    CatResponseV2:
      type: object
      description: Response payload for a cat resource
      allOf:
        - $ref: '#/components/schemas/PetResponseV2Base'
        - type: object
          required:
            - breedType
            - indoor
            - age
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false
            age:
              type: number
              minimum: 0
              maximum: 30
              description: Age of the cat in years
              examples:
                - 3.5

    # -----------------------------------------------
    # Dog response - child references parent via allOf
    # -----------------------------------------------

    DogResponseV2:
      type: object
      description: Response payload for a dog resource
      allOf:
        - $ref: '#/components/schemas/PetResponseV2Base'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

  securitySchemes:
    apiKeyAuth:
        type: apiKey
        in: header
        name: X-API-Key
    httpBasic:
      type: http
      scheme: basic
      description: HTTP Basic Authentication
    httpBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HTTP Bearer Authentication with JWT tokens
    mtls:
      type: mutualTLS
      description: Mutual TLS authentication using client certificates
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/oauth/token
          scopes:
            read:pets: Read access to pets
            write:pets: Write access to pets
    oauth2:
        type: oauth2
        flows:
          authorizationCode:
            authorizationUrl: https://example.com/oauth/authorize
            tokenUrl: https://example.com/oauth/token
            scopes:
                read:pets: Read access to pets
                write:pets: Write access to pets
          implicit:
            authorizationUrl: https://example.com/api/oauth/dialog
            scopes: {}
    openID:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    bearerHttp:
      description: Bearer token using a JWT
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicHttp:
      description: Basic HTTP Authentication
      type: http
      scheme: basic
