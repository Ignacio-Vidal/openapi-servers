#              $ref: '#/components/schemas/DogBreedType'
#            trained:
#              type: boolean
#              description: Whether the dog is house trained
#              examples:
#                - true
#            weightKg:
#              type: number
#              format: double
#              minimum: 0.1
#              maximum: 120.0
#              description: Weight of the dog in kilograms
#              examples:
#                - 30.5

    PetResponseV2:
      type: object
      properties:
        petType:
          $ref: '#/components/schemas/PetType'
      oneOf:
        - $ref: '#/components/schemas/CatResponseV2'
        - $ref: '#/components/schemas/DogResponseV2'
      discriminator:
        propertyName: petType
        mapping:
          CAT: '#/components/schemas/CatResponseV2'
          DOG: '#/components/schemas/DogResponseV2'

    # -----------------------------------------------
    # Cat response - child references parent via allOf
    # -----------------------------------------------

    PetResponseV2Base:
      type: object
      required:
        - petType
        - name
      properties:
        petType:
          $ref: '#/components/schemas/PetType'
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the pet
          examples:
            - "Whiskers"

    CatResponseV2:
      type: object
      description: Response payload for a cat resource
      allOf:
        - $ref: '#/components/schemas/PetResponseV2Base'
        - type: object
          required:
            - breedType
            - indoor
            - age
          properties:
            breedType:
              $ref: '#/components/schemas/CatBreedType'
            indoor:
              type: boolean
              description: Whether the cat is an indoor cat
              examples:
                - true
            declawed:
              type: boolean
              description: Whether the cat has been declawed
              examples:
                - false
            age:
              type: number
              minimum: 0
              maximum: 30
              description: Age of the cat in years
              examples:
                - 3.5

    # -----------------------------------------------
    # Dog response - child references parent via allOf
    # -----------------------------------------------

    DogResponseV2:
      type: object
      description: Response payload for a dog resource
      allOf:
        - $ref: '#/components/schemas/PetResponseV2Base'
        - type: object
          required:
            - breedType
            - trained
          properties:
            breedType:
              $ref: '#/components/schemas/DogBreedType'
            trained:
              type: boolean
              description: Whether the dog is house trained
              examples:
                - true
            weightKg:
              type: number
              format: double
              minimum: 0.1
              maximum: 120.0
              description: Weight of the dog in kilograms
              examples:
                - 30.5

  securitySchemes:
    apiKeyAuth:
        type: apiKey
        in: header
        name: X-API-Key
    httpBasic:
      type: http
      scheme: basic
      description: HTTP Basic Authentication
    httpBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HTTP Bearer Authentication with JWT tokens
    mtls:
      type: mutualTLS
      description: Mutual TLS authentication using client certificates
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/oauth/token
          scopes:
            read:pets: Read access to pets
            write:pets: Write access to pets
    oauth2:
        type: oauth2
        flows:
          authorizationCode:
            authorizationUrl: https://example.com/oauth/authorize
            tokenUrl: https://example.com/oauth/token
            scopes:
                read:pets: Read access to pets
                write:pets: Write access to pets
          implicit:
            authorizationUrl: https://example.com/api/oauth/dialog
            scopes: {}
    openID:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    bearerHttp:
      description: Bearer token using a JWT
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicHttp:
      description: Basic HTTP Authentication
      type: http
      scheme: basic
