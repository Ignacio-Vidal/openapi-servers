receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  resourcedetection:
    detectors: [env, system]
    timeout: 5s

exporters:
  otlp/pyroscope:
    endpoint: pyroscope:4040
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [otlp/pyroscope, debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [debug]
